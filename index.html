.dc12{left:3%;top:86%;width:70px;transform:rotate(10deg)}
.dc13{right:14%;top:87%;width:120px;transform:rotate(6deg)}
@media (max-width:759px){.dc0{left:-18px;top:2%;width:84px}.dc1{right:-14px;top:5%;width:74px}.dc2{right:-22px;top:22%;width:64px}.dc3{left:-50px;top:24%;width:140px}.dc4{display:none}.dc5{right:-24px;top:40%;width:80px}.dc6{left:-30px;top:54%;width:84px}.dc7{display:none}.dc8{display:none}.dc9{right:-40px;top:66%;width:160px}.dc10{display:none}.dc11{right:-22px;top:82%;width:70px}.dc12{left:-20px;top:88%;width:56px}.dc13{display:none}}

#app{max-width:560px;margin:0 auto;padding:12px 14px calc(var(--foot) + 26px);min-height:100vh;min-height:100dvh}
.screen{animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.93)}55%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bounce{0%,80%,100%{transform:scale(.6);opacity:.5}40%{transform:scale(1);opacity:1}}

/* кнопки */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 20px;border-radius:16px;
  font-weight:700;font-size:17px;color:#fff;background:var(--blue);border-bottom:4px solid var(--navy);
  box-shadow:0 10px 18px -12px rgba(31,50,94,.7);transition:transform .12s,filter .15s;text-decoration:none;text-align:center}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn[disabled]{background:#dfe5ef;color:#8a98b3;border-bottom-color:#c8d2e2;box-shadow:none;pointer-events:none}
.btn.ghost{color:var(--navy);background:#fff;border:2px solid var(--line2);border-bottom:4px solid var(--line2);box-shadow:none}
.btn.small{padding:10px 14px;font-size:14.5px;border-radius:13px}
.btn.red{background:var(--red);border-bottom-color:#8f3a33}
.btn.tg{background:#3f8fcb;border-bottom-color:#2e6f9f}
.btn.wait{background:#dfe5ef;color:#8a98b3;border-bottom-color:#c8d2e2;box-shadow:none;pointer-events:none}
.row{display:flex;gap:10px}.row>*{flex:1}
.stack{display:flex;flex-direction:column;gap:10px}
.sp{height:12px}.sp2{height:22px}

/* карточки */
.card{background:var(--card);border:2px solid var(--navy);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.card.soft{border:2px dashed var(--line2);box-shadow:none;background:rgba(255,250,240,.88)}

/* главная */
.home{text-align:center;padding-top:6px}
.logo{width:150px;height:auto;display:block;margin:2px auto 0;animation:floaty 6s ease-in-out infinite}
.kicker{font-family:var(--fh);font-weight:800;font-size:13px;letter-spacing:.14em;color:var(--blue);text-transform:uppercase;margin-top:4px}
.title{font-size:36px;line-height:1.02;margin:8px 0 10px}
.title span{display:block;color:var(--blue)}
.lead{color:var(--ink2);font-size:15.5px;margin:0 auto 16px;max-width:400px}
.lab{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin:0 0 6px}
.inp{width:100%;font:inherit;font-size:18px;font-weight:700;padding:13px 14px;border-radius:14px;border:2px solid var(--line2);background:#fff;color:var(--ink);outline:none}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(147,182,238,.35)}
.inp.code{font-size:23px;letter-spacing:.14em;text-align:center}
.or{display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--ink3);font-size:13px;font-weight:700}
.or::before,.or::after{content:"";flex:1;height:2px;background:var(--line)}
.joinrow{display:flex;gap:10px}
.joinrow .inp{flex:1.2;min-width:0}
.joinrow .btn{width:auto;flex:1;padding-left:14px;padding-right:14px}
.invite{text-align:center;font-size:15.5px;background:var(--cream);border:2px dashed #e6d38f;border-radius:14px;padding:10px}
.invite b{font-size:20px;letter-spacing:.1em;color:var(--navy)}
.how{margin-top:14px;display:flex;flex-direction:column;gap:12px}
.step{display:flex;gap:12px;align-items:center;font-size:14.5px;color:var(--ink2);text-align:left}
.step i{flex:none;width:30px;height:30px;border-radius:50%;background:var(--pink);color:var(--navy);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:14px}
.step b{color:var(--ink)}
.rules{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:0 0 14px}
.chip{display:inline-block;font-size:12.5px;font-weight:700;color:var(--navy);background:var(--peach);border:1.5px solid #ecc3a3;border-radius:99px;padding:3px 10px}
.chip.pink{background:var(--pink);border-color:#e4c2c2}
.chip.mint{background:var(--cream);border-color:#e8dba5}
.note-err{background:var(--red-l);border:2px solid #e3b4af;color:#8f3a33;border-radius:16px;padding:12px 14px;margin:0 0 12px;font-weight:700;font-size:14.5px;animation:rise .3s both}
.note-ok{background:var(--green-l);border:2px solid #b8cbb1;color:#4b6648;border-radius:14px;padding:10px;margin:0 0 12px;font-weight:700;animation:pop .4s both}

/* лобби */
.center{text-align:center;padding-top:26px}
.h2{font-size:24px;line-height:1.15;margin:12px 0 8px}
.muted{color:var(--ink2);font-size:15px;max-width:390px;margin:0 auto}
.spinner{width:46px;height:46px;border-radius:50%;border:5px solid var(--sky-l);border-top-color:var(--blue);margin:8px auto 6px;animation:spin 1s linear infinite}
.dots{display:flex;gap:8px;justify-content:center;margin:12px 0}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--blue);animation:bounce 1.2s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
.codebox{text-align:center}
.codebox small{font-family:var(--fh);font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.bigcode{font-size:50px;font-weight:700;letter-spacing:.1em;line-height:1.1;margin:8px 0 14px;color:var(--navy);font-variant-numeric:tabular-nums}
.waiting{text-align:center;margin-top:18px;color:var(--ink2)}
.waiting p{font-weight:700;font-size:15.5px}
.waiting small{color:var(--ink3);font-size:13px}
.sadcat{width:150px;display:block;margin:0 auto}
.vsline{display:flex;align-items:center;justify-content:center;gap:12px;margin:6px 0 10px}
.vsline>span{font-family:var(--fh);font-weight:800;color:var(--ink3);font-size:16px}
.vsline .pl{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:96px}
.av{width:58px;height:58px;border-radius:19px;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:20px;color:#fff;background:var(--blue);border-bottom:3px solid var(--navy)}
.av.op{background:#d0857c;border-bottom-color:#a65c54}
.vsline .pl b{font-size:15px}

/* шапка игры */
.hud{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.iconbtn{width:42px;height:42px;border-radius:14px;background:#fff;border:2px solid var(--line2);display:grid;place-items:center;flex:none;color:var(--ink2);transition:transform .12s}
.iconbtn:active{transform:scale(.94)}
.hud .mid{flex:1;min-width:0}
.hud .mid b.t{display:block;font-size:16px;font-weight:700;text-align:center}
.hud .mid small{display:block;text-align:center;color:var(--ink3);font-size:13px}
.vs{display:flex;align-items:center;justify-content:space-between;gap:6px}
.vs .pl{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.vs .pl.op{justify-content:flex-end;text-align:right}
.vs .av{width:38px;height:38px;border-radius:13px;font-size:13.5px;flex:none}
.vs .pl b{display:block;font-size:13px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs .pl>div{min-width:0}
.vs .pts{display:block;font-size:20px;font-weight:700;color:var(--blue);line-height:1.15;font-variant-numeric:tabular-nums}
.vs .pl.op .pts{color:#b86157}
.vs .qn{text-align:center;flex:none;line-height:1}
.vs .qn small{display:block;font-size:10.5px;font-weight:700;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase}
.vs .qn b{font-size:20px;font-weight:700}
.vs .qn em{font-style:normal;color:var(--ink3);font-size:14px}
.tbar{position:relative;height:12px;border-radius:99px;background:#f2e3cf;margin:0 0 12px;overflow:hidden}
.tbar div{height:100%;border-radius:99px;background:linear-gradient(90deg,#f0b9a6,#e48b74);transition:width .12s linear}
.tbar div.low{background:linear-gradient(90deg,#e48b74,var(--red))}
.tbar span{position:absolute;right:8px;top:-1px;font-size:11px;font-weight:700;color:var(--navy);line-height:14px}

/* вопрос */
.qcard{padding:18px 18px 16px}
.qtag{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.ost{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--ink3)}
.ost.done{color:var(--green)}
.qbox{background:var(--cream);border:2px dashed #e6dcae;border-radius:16px;padding:14px 15px;font-size:18.5px;line-height:1.35;font-weight:700}
.qbox.pink{background:#fbeaea;border-color:#e9c6c6}
.q{font-size:19px;line-height:1.32;font-weight:700}
.qsub{display:block;font-size:14px;color:var(--ink2);font-weight:700;margin-top:10px}
.qsub b{color:var(--blue)}
.organ{display:flex;gap:12px;align-items:center}
.organ .ic{width:56px;height:56px;border-radius:18px;flex:none;display:grid;place-items:center;background:var(--sky-l);border:2px solid var(--sky);color:var(--navy)}
.organ b{display:block;font-size:20px;line-height:1.15}
.organ span{font-size:13.5px;color:var(--ink2)}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{position:relative;display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:12px 13px;border-radius:15px;
  background:#fffefb;border:2px solid var(--line);border-bottom:4px solid var(--line2);font-weight:600;font-size:15.5px;line-height:1.32;
  transition:transform .12s,background .2s,border-color .2s}
.opt:hover{border-color:#e9b7a3}
.opt:active{transform:translateY(1px)}
.opt .k{flex:none;width:30px;height:30px;border-radius:10px;background:var(--sky-l);color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt .t{flex:1;min-width:0}
.opt.correct{background:var(--green-l);border-color:var(--green);border-bottom-color:#4b6648;animation:pop .4s}
.opt.correct .k{background:var(--green);color:#fff}
.opt.wrong{background:var(--red-l);border-color:#d99089;border-bottom-color:var(--red);animation:shake .45s}
.opt.wrong .k{background:var(--red);color:#fff}
.opt.mine{background:#e7eefb;border-color:var(--blue);border-bottom-color:var(--navy)}
.opt.dim{opacity:.55}
.opts.locked .opt,.two.locked .opt{pointer-events:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.two .opt{flex-direction:column;justify-content:center;text-align:center;gap:8px;padding:16px 8px 20px;font-size:15px;font-weight:700}
.two .opt svg{width:32px;height:32px;color:var(--blue)}
.two .opt.correct svg{color:var(--green)}.two .opt.wrong svg{color:var(--red)}
.pks{display:flex;gap:4px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.two .opt .pks{position:absolute;right:6px;bottom:5px}
.pk{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;line-height:1.3;color:#fff}
.pk.me{background:var(--blue)}
.pk.op{background:#c26a5f}
.wtxt{margin-top:12px;text-align:center;color:var(--ink2);font-weight:700;font-size:14px;animation:fade .3s both}

/* пояснение */
.fb{margin-top:14px;border-radius:18px;padding:14px 15px;animation:rise .3s both;scroll-margin-bottom:96px}
.fb.ok{background:var(--green-l);border:2px solid #b8cbb1}
.fb.no{background:var(--red-l);border:2px solid #e3b4af}
.fb h4{margin:0 0 4px;font-size:17px;font-weight:700}
.fb.ok h4{color:#4b6648}.fb.no h4{color:#8f3a33}
.oppline{font-size:13.5px;font-weight:700;color:var(--ink2);margin-bottom:8px}
.fb p{font-size:14.5px;line-height:1.48;color:var(--ink);font-weight:500}
.fb p b{font-weight:700}
.fb .hint{margin-top:8px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.7);font-size:14px;font-weight:600}
.fb .src{margin-top:8px;font-size:12px;color:var(--ink2);font-weight:700;opacity:.85}
.fb .btn{margin-top:12px}

/* финал */
.result{text-align:center}
.result .logo{width:140px}
.result h2{font-size:28px;line-height:1.1;margin:8px 0 6px}
.result p.sub{color:var(--ink2);font-size:15px;margin:0 auto 6px;max-width:370px}
.duelbox{display:flex;align-items:stretch;justify-content:center;gap:8px;margin:14px 0}
.duelbox .side{flex:1;background:var(--card);border:2px solid var(--line2);border-radius:20px;padding:14px 8px;box-shadow:var(--shadow)}
.duelbox .side.w{border-color:var(--navy);background:linear-gradient(170deg,#fde9dc,var(--card))}
.duelbox small{display:block;font-size:13px;font-weight:700;color:var(--ink2)}
.duelbox b{display:block;font-size:44px;font-weight:700;line-height:1.05;color:var(--blue);font-variant-numeric:tabular-nums}
.duelbox .side.op b{color:#b86157}
.duelbox span{font-size:12.5px;color:var(--ink2);font-weight:700}
.duelbox .sep{align-self:center;font-size:28px;font-weight:700;color:var(--ink3)}
.dotrow{display:flex;gap:4px;justify-content:center;margin-top:9px;flex-wrap:wrap}
.dotrow i{width:10px;height:10px;border-radius:50%}
.dotrow i.y{background:var(--green)}.dotrow i.n{background:#e3b4af}
.miss{margin-top:16px;text-align:left}
.miss h3{font-size:18px;margin:0 0 10px}
.mi{padding:11px 0;border-top:2px dashed var(--line)}
.mi:first-of-type{border-top:0;padding-top:0}
.mi>b{font-size:14.5px;line-height:1.38;display:block}
.mi .ca{font-size:14px;font-weight:700;color:#4b6648;margin:5px 0 3px}
.mi p{font-size:13.5px;color:var(--ink2);line-height:1.45;margin:0}
.mi small{display:block;color:var(--ink3);font-size:12px;font-weight:700;margin-top:3px}

.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.confetti i{position:absolute;top:-14px;width:9px;height:14px;border-radius:3px;opacity:0;animation:fall 2.6s cubic-bezier(.3,.6,.4,1) forwards}
@keyframes fall{0%{opacity:0;transform:translate3d(0,0,0) rotate(0)}10%{opacity:1}100%{opacity:0;transform:translate3d(var(--dx),105vh,0) rotate(var(--rot))}}
.toast{position:fixed;left:50%;bottom:calc(var(--foot) + 20px);transform:translateX(-50%);background:var(--navy);color:#fff;font-weight:700;font-size:14px;padding:10px 16px;border-radius:99px;z-index:80;animation:rise .25s both;white-space:nowrap}

/* модалка */
#modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
#modal.open{display:flex}
#modal .back{position:absolute;inset:0;background:rgba(31,50,94,.4);animation:fade .2s both}
#modal .box{position:relative;width:min(380px,100%);background:var(--card);border:2px solid var(--navy);border-radius:22px;padding:22px 20px 18px;text-align:center;animation:pop .3s both}
#modal h3{font-size:21px;margin-bottom:6px}
#modal p{color:var(--ink2);font-size:15px;margin-bottom:16px}

/* подвал */
#foot{position:fixed;left:0;right:0;bottom:0;height:var(--foot);z-index:50;display:flex;align-items:center;justify-content:center;gap:10px;
  background:rgba(254,251,244,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:2px solid var(--line);padding:0 14px}
#foot img{height:40px;width:auto;flex:none}
#foot .nm{font-family:var(--fh);font-weight:800;font-size:13.5px;line-height:1.08;text-transform:uppercase;color:var(--navy);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#foot .nm small{display:block;font-family:'Comfortaa',sans-serif;text-transform:none;font-size:11px;color:var(--ink3);font-weight:700;margin-top:3px}
#foot a.sub{flex:none;padding:8px 14px;border-radius:99px;background:var(--blue);color:#fff;text-decoration:none;font-weight:700;font-size:13.5px;border-bottom:3px solid var(--navy);white-space:nowrap}
#foot a.sub:active{transform:translateY(1px)}

@media (max-width:400px){
  .title{font-size:30px}
  .qbox{font-size:17px}.q{font-size:17.5px}
  .opt{font-size:14.5px;padding:11px}
  #foot .nm{font-size:12.5px}#foot .nm small{font-size:10px}
  #foot img{height:34px}
  #foot a.sub{padding:7px 11px;font-size:12.5px}
  .bigcode{font-size:42px}
}
@media (min-width:700px){#app{padding-top:26px}.title{font-size:42px}.qbox{font-size:20px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

function confetti(n){
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var box = document.createElement('div'); box.className = 'confetti';
  var cols = ['#93b6ee', '#3e6287', '#f1dada', '#c9f9fc', '#6e8c6a', '#1f325e', '#fcf9ea'];
  for (var i = 0; i < (n || 34); i++){
    var p = document.createElement('i');
    p.style.left = rnd(100) + '%'; p.style.background = pick(cols);
    p.style.setProperty('--dx', (rnd(120) - 60) + 'px'); p.style.setProperty('--rot', (rnd(720) - 360) + 'deg');
    p.style.animationDelay = (rnd(700) / 1000) + 's'; p.style.animationDuration = (2 + rnd(150) / 100) + 's';
    box.appendChild(p);
  }
  document.body.appendChild(box);
  setTimeout(function(){ if (box.parentNode) box.parentNode.removeChild(box); }, 3600);
}

var N_Q = 10, N_POW = 7;
var SRC_P = function(b){ return 'Шпаргалка «Полномочия» · раздел ' + BODIES[b].s; };
var SRC_J = 'Шпаргалка «Полномочия» · раздел 2.1', SRC_F = 'Шпаргалка «Полномочия» · раздел 2.2';

function placeAt(correct, others, slot){
  var o = others.slice(), out = [];
  for (var i = 0, j = 0; i < o.length + 1; i++) out.push(i === slot ? correct : o[j++]);
  return {opts:out, ci:slot};
}
function blocked(item, b){ return (item.x || []).indexOf(b) >= 0; }

function otherBodies(item){            // 3 правдоподобных «чужих» органа
  var res = [];
  POOLS[BODIES[item.b].g].concat([['PK','SK'], Object.keys(BODIES)]).forEach(function(grp){
    shuffle(grp).forEach(function(b){ if (res.length < 3 && b !== item.b && !blocked(item, b) && res.indexOf(b) < 0) res.push(b); });
  });
  return res;
}
function otherPowers(item){            // 3 полномочия других органов, которых у item.b точно нет
  var bodies = [], res = [];
  POOLS[BODIES[item.b].g].forEach(function(grp){ grp.forEach(function(b){ if (bodies.indexOf(b) < 0) bodies.push(b); }); });
  var cand = shuffle(POWERS.filter(function(p){
    return p.b !== item.b && bodies.indexOf(p.b) >= 0 && !blocked(p, item.b) && !blocked(item, p.b);
  }));
  var usedB = {};
  cand.forEach(function(p){ if (res.length < 3 && !usedB[p.b]){ usedB[p.b] = 1; res.push(p); } });
  cand.forEach(function(p){ if (res.length < 3 && res.indexOf(p) < 0) res.push(p); });
  return res;
}

function whoQ(item){
  var ob = otherBodies(item), pl = placeAt(item.b, shuffle(ob), rnd(4));
  var n = 'Верный ответ — <b>' + esc(BODIES[item.b].n) + '</b>: «' + esc(item.t) + '».';
  return {kind:'who', rv:'', cat:'Полномочия', text:item.t, opts:pl.opts.map(function(b){ return BODIES[b].n; }), ci:pl.ci,
          n:n, h:item.h || '', src:SRC_P(item.b), label:'Чьё полномочие: «' + item.t + '»', ans:BODIES[item.b].n};
}
function whatQ(item){
  var op = otherPowers(item), pl = placeAt(item, shuffle(op), rnd(4));
  var rest = op.map(function(p){ return '«' + esc(p.t) + '» — ' + esc(BODIES[p.b].n); }).join('; ');
  var n = 'Верно: у органа <b>' + esc(BODIES[item.b].n) + '</b> есть полномочие «' + esc(item.t) + '». Остальное: ' + rest + '.';
  return {kind:'what', rv:'Остальное: ' + rest + '.', cat:'Полномочия', organ:BODIES[item.b].n, text:BODIES[item.b].n,
          opts:pl.opts.map(function(p){ return p.t; }), ci:pl.ci, n:n, h:item.h || '', src:SRC_P(item.b),
          label:'Полномочие органа «' + BODIES[item.b].n + '»', ans:item.t};
}

          h:item.h || '', src:joint ? SRC_J : SRC_F, label:'Чьё ведение: «' + item.t + '»', ans:joint ? JT : FT};

function jur4Q(item, others, joint){
  var pl = placeAt(item.t, shuffle(others).map(function(o){ return o.t; }), rnd(4));
  return {kind:'jur4', cat:'Предметы ведения', joint:joint, rv:'Остальные варианты — ' + (joint ? 'только ведение РФ.' : 'совместное ведение РФ и субъектов.'),

function buildQuestions(){
  /* 7 органов: 3 «верховных» + 1 суд + 3 правоохранительных (все разные) */
  var top = shuffle(['P','SF','GD','PR']).slice(0, 3);
  var court = [pick(['VS','KS'])];
  var law = shuffle(['PK','PL','SK','GI','FSB','FSSP','FSIN','ADV','NOT']).slice(0, N_POW - 4);
  var bodies = shuffle(top.concat(court, law));
  var kinds = shuffle(['who','who','who','who','what','what','what']);   // 4 «чьё полномочие» + 3 «что из этого»
  var qs = bodies.map(function(b, i){
    var item = pick(POWERS.filter(function(p){ return p.b === b; }));
    return kinds[i] === 'who' ? whoQ(item) : whatQ(item);
  });

  /* 3 вопроса по предметам ведения: один «чьё ведение?», один «что совместное?», один «что только РФ?» */
  var J = shuffle(JOINT), F = shuffle(FED);
  var j2joint = rnd(2) === 0;
  qs.push(j2joint ? jur2Q(J.shift(), true) : jur2Q(F.shift(), false));
  qs.push(jur4Q(J.shift(), [F.shift(), F.shift(), F.shift()], true));
  qs.push(jur4Q(F.shift(), [J.shift(), J.shift(), J.shift()], false));

  /* порядок: вопросы по предметам ведения не подряд */
  var best = qs;
  for (var k = 0; k < 300; k++){
    var arr = shuffle(qs), ok = true;
    for (var i = 1; i < arr.length; i++) if (arr[i].cat === 'Предметы ведения' && arr[i-1].cat === 'Предметы ведения'){ ok = false; break; }
    best = arr; if (ok) break;
  }
  return best;
}

   СЕТЬ · два браузера соединяются напрямую (WebRTC, PeerJS).
   Код комнаты — 6 цифр. Через бесплатный сервис PeerJS идёт только «знакомство».
   =================================================================== */
var PREFIX = 'oik-polnom1-';
var NET = {peer:null, conn:null, role:null, code:null, onMsg:null, onClose:null, onState:null, timer:null, dead:false};

function peerOptions(){
  var m = /[?&]ps=([^&#]+)/.exec(location.search), o = {debug:0};
  if (m){ var hp = decodeURIComponent(m[1]).split(':'); o.host = hp[0]; o.port = +(hp[1] || 9000); o.path = '/'; o.secure = false; o.config = {iceServers:[]}; }
  return o;
}
function newCode(){ var s = ''; for (var i = 0; i < 6; i++) s += rnd(10); return s; }
function fmtCode(c){ return c.slice(0, 3) + ' ' + c.slice(3); }
function cleanCode(v){ return String(v || '').replace(/[^0-9]/g, '').slice(0, 6); }

function netReset(){
  NET.dead = true; clearTimeout(NET.timer);
  try { if (NET.conn) NET.conn.close(); } catch (e) {}
  try { if (NET.peer) NET.peer.destroy(); } catch (e) {}
  NET.peer = null; NET.conn = null; NET.role = null; NET.code = null;
}
function send(msg){ try { if (NET.conn && NET.conn.open) NET.conn.send(msg); } catch (e) {} }
function wireConn(conn){
  NET.conn = conn;
  conn.on('data', function(m){ if (NET.onMsg) NET.onMsg(m); });
  conn.on('close', function(){ if (!NET.dead && NET.onClose) NET.onClose(); });
  conn.on('error', function(){ if (!NET.dead && NET.onClose) NET.onClose(); });
}
function hostRoom(cb){
  netReset(); NET.dead = false; NET.role = 'host';
  var tries = 0, done = false;
  function attempt(){
    var code = newCode(), peer;
    try { peer = new Peer(PREFIX + code, peerOptions()); } catch (e) { return cb('lib'); }
    NET.peer = peer; NET.code = code;
    peer.on('open', function(){ if (!done){ done = true; clearTimeout(NET.timer); cb(null, code); } });
    peer.on('error', function(err){
      if (NET.dead) return;
      if (err && err.type === 'unavailable-id' && tries++ < 6){ try { peer.destroy(); } catch (e) {} return attempt(); }
      if (!done){ done = true; clearTimeout(NET.timer); cb(err && err.type || 'net'); }
    });
    peer.on('disconnected', function(){ try { if (!NET.dead) peer.reconnect(); } catch (e) {} });
    peer.on('connection', function(conn){
      if (NET.conn && NET.conn.open){ conn.on('open', function(){ try { conn.send({t:'busy'}); } catch (e) {} setTimeout(function(){ try { conn.close(); } catch (e) {} }, 200); }); return; }
      conn.on('open', function(){ wireConn(conn); if (NET.onState) NET.onState('joined'); });
    });
  }
  clearTimeout(NET.timer);
  NET.timer = setTimeout(function(){ if (!done){ done = true; cb('timeout'); } }, 15000);
  attempt();
}
function joinRoom(code, cb){
  netReset(); NET.dead = false; NET.role = 'guest'; NET.code = code;
  var done = false, peer;
  try { peer = new Peer(peerOptions()); } catch (e) { return cb('lib'); }
  NET.peer = peer;
  function fail(e){ if (!done){ done = true; clearTimeout(NET.timer); cb(e); } }
  peer.on('error', function(err){ if (!NET.dead) fail(err && err.type || 'net'); });
  peer.on('open', function(){
    var conn = peer.connect(PREFIX + code, {reliable:true});
    conn.on('open', function(){ if (!done){ done = true; clearTimeout(NET.timer); wireConn(conn); cb(null); } });
    conn.on('error', function(){ fail('net'); });
    conn.on('close', function(){ if (!done) fail('closed'); });
  });
  NET.timer = setTimeout(function(){ fail('timeout'); }, 18000);
}

function connecting(text){ screen('<div class="center"><div class="spinner"></div><h2 class="h2 hd">' + esc(text) + '</h2><p class="muted">Это займёт несколько секунд</p></div>'); }
function netError(err){
  var m;

  else if (err === 'timeout') m = 'Не получилось соединиться. Проверь интернет и попробуйте ещё раз (иногда помогает переключиться с Wi-Fi на мобильную сеть).';

  else m = 'Нет связи с сервисом знакомства игроков. Проверь интернет и попробуй ещё раз.';

}
function createGame(){

}

function vsLine(){

function hostOnMsg(m){
  if (!m || !m.t) return;

    OPP.name = cleanName(m.name) || 'Соперник';
    if (OPP.name === ME.name) OPP.name = OPP.name + ' 2';

    readyHost();
  } else if (m.t === 'ans'){ hostRecord('g', m.k, m.ms, m.i);
  } else if (m.t === 'ready'){ if (H && m.i === H.i){ H.ready.g = true; if (H.ready.h && H.revealed) advance(); }
  } else if (m.t === 'again'){ if (H){ H.again.g = true; if (H.again.h) startGame(); else if (V){ V.oppAgain = true; renderFinal(); } }
  } else if (m.t === 'bye'){ opponentLeft(); }
}

  screen('<div class="center">' + vsLine() +
    '<h2 class="h2 hd">Соперник на месте!</h2>' +

    '<div class="sp2"></div><button class="btn" id="st">Начать дуэль</button><div class="sp"></div><button class="btn ghost" id="lv">Выйти</button></div>');
  $('#st').onclick = startGame;
  $('#lv').onclick = leaveGame;
}

/* ---------- вход по коду ---------- */
function joinGame(code){
  readName(); connecting('Подключаемся к комнате ' + fmtCode(code) + '…');
  joinRoom(code, function(err){
    if (err) return netError(err);
    NET.onMsg = guestOnMsg; NET.onClose = opponentLeft;
    send({t:'hello', name:ME.name});
    try { history.replaceState(null, '', location.href.split('#')[0]); } catch (e) {}
    screen('<div class="center"><div class="spinner"></div><h2 class="h2 hd">Подключились!</h2><p class="muted">Ждём, пока хозяин комнаты начнёт игру…</p><div class="sp2"></div><button class="btn ghost" id="lv">Выйти</button></div>');
    $('#lv').onclick = leaveGame;
  });
}
function guestOnMsg(m){
  if (!m || !m.t) return;
  if (m.t === 'welcome'){
    OPP.name = cleanName(m.name) || 'Соперник'; if (m.opp) ME.name = m.opp;
    screen('<div class="center">' + vsLine() + '<h2 class="h2 hd">Вы в комнате!</h2><p class="muted">Ждём, пока <b>' + esc(OPP.name) + '</b> начнёт дуэль…</p><div class="dots"><i></i><i></i><i></i></div><div class="sp2"></div><button class="btn ghost" id="lv">Выйти</button></div>');
    $('#lv').onclick = leaveGame;
  } else if (m.t === 'busy'){ netReset(); netError('busy');
  } else if (m.t === 'start'){ V = {n:m.n, i:-1, scores:{me:0, opp:0}, oppAgain:false};
  } else if (m.t === 'q'){ showQuestion(m.i, m.q);
  } else if (m.t === 'st'){ if (V && V.i === m.i && !V.rev){ V.oppDone = !!m[op()]; paintStatus(); }
  } else if (m.t === 'rev'){ applyReveal(m);
  } else if (m.t === 'end'){ showFinal(m);
  } else if (m.t === 'again'){ if (V){ V.oppAgain = true; renderFinal(); }
  } else if (m.t === 'bye'){ opponentLeft(); }
}
function leaveGame(){ send({t:'bye'}); setTimeout(function(){ netReset(); home(); }, 80); }
function opponentLeft(){
  if (!NET.role) return;
  if (H){ clearTimeout(H.timer); clearTimeout(H.adv); }
  clearInterval(window.__tint);
  var fin = V && V.final;

  if (fin){ toast('Соперник вышел'); var a = $('#again'); if (a){ a.disabled = true; a.textContent = 'Соперник вышел'; } return; }
  screen('<div class="center">' + sadCat() + '<h2 class="h2 hd">Соперник вышел из игры</h2><p class="muted">Связь прервалась. Можно создать новую комнату и позвать друга снова.</p><div class="sp2"></div><button class="btn" id="hm">В начало</button></div>');
  $('#hm').onclick = function(){ home(); };
}

/* ---------- игра · хозяин ---------- */
function startGame(){
  H = {qs:buildQuestions(), i:-1, ans:{h:null, g:null}, scores:{h:0, g:0}, rows:[], revealed:false, ready:{h:false, g:false}, again:{h:false, g:false}, timer:0, adv:0};
  V = {n:N_Q, i:-1, scores:{me:0, opp:0}, oppAgain:false};
  send({t:'start', n:N_Q});
  nextQuestion();
}
function nextQuestion(){
  clearTimeout(H.timer); clearTimeout(H.adv);
  H.i++;
  if (H.i >= H.qs.length) return finishGame();
  H.ans = {h:null, g:null}; H.revealed = false; H.ready = {h:false, g:false};
  var pq = publicQ(H.qs[H.i]);
  send({t:'q', i:H.i, q:pq});
  showQuestion(H.i, pq);
  H.timer = setTimeout(reveal, (T_SEC + 3) * 1000);
}
function hostRecord(who, k, ms, i){
  if (!H || H.revealed || (i !== undefined && i !== H.i) || H.ans[who]) return;
  var len = H.qs[H.i].opts.length;
  k = +k; if (!(k >= 0 && k < len)) k = -1;
  ms = Math.max(0, Math.min(T_SEC * 1000, +ms || T_SEC * 1000));
  H.ans[who] = {k:k, ms:ms};
  send({t:'st', i:H.i, h:!!H.ans.h, g:!!H.ans.g});
  if (V && V.i === H.i){ V.oppDone = !!H.ans.g; paintStatus(); }
  if (H.ans.h && H.ans.g){ clearTimeout(H.timer); H.timer = setTimeout(reveal, 650); }
}
function pointsFor(a, q){ if (!a || a.k !== q.ci) return 0; return 10 + Math.max(0, Math.round(5 * (1 - a.ms / (T_SEC * 1000)))); }
function reveal(){
  if (!H || H.revealed) return;
  H.revealed = true; clearTimeout(H.timer);
  var q = H.qs[H.i], a = H.ans, p = {h:pointsFor(a.h, q), g:pointsFor(a.g, q)};
  H.scores.h += p.h; H.scores.g += p.g;
  var pk = {h:a.h ? a.h.k : -1, g:a.g ? a.g.k : -1};
  H.rows.push({label:q.label, ans:q.ans, n:q.rv, h:q.h, src:q.src, pk:pk, ci:q.ci});
  var msg = {t:'rev', i:H.i, ci:q.ci, note:q.n, hint:q.h, src:q.src, pick:pk, pts:p, scores:{h:H.scores.h, g:H.scores.g}};
  send(msg); applyReveal(msg);
  H.adv = setTimeout(advance, 25000);
}
function advance(){ if (H && H.revealed) nextQuestion(); }
function finishGame(){
  var msg = {t:'end', scores:{h:H.scores.h, g:H.scores.g}, rows:H.rows};
  send(msg); showFinal(msg);
}

/* ---------- экран вопроса ---------- */
function showQuestion(i, q){
  V.i = i; V.q = q; V.picked = null; V.locked = false; V.rev = null; V.ready = false; V.oppDone = false; V.t0 = Date.now(); V.final = false;

}
function tick(){
  if (!V || V.rev) return clearInterval(window.__tint);
  var left = T_SEC - (Date.now() - V.t0) / 1000, bar = $('#tb'), num = $('#tn');
  if (bar){ bar.style.width = Math.max(0, left / T_SEC * 100) + '%'; bar.classList.toggle('low', left < 6); }
  if (num) num.textContent = Math.max(0, Math.ceil(left));
  if (left <= 0 && !V.locked) pickAnswer(-1);
}
function pickAnswer(k){
  if (!V || V.locked || V.rev) return;
  V.locked = true; V.picked = k;
  var ms = Math.min(T_SEC * 1000, Date.now() - V.t0);
  if (NET.role === 'host') hostRecord('h', k, ms, V.i); else send({t:'ans', i:V.i, k:k, ms:ms});
  renderGame();
}
function paintStatus(){
  var el = $('#ost'); if (!el || !V) return;

  el.textContent = V.rev ? '' : (V.oppDone ? 'соперник ответил' : 'соперник думает…');

function scoreboard(){
  var s = V.scores;
  return '<div class="vs">' +
    '<div class="pl"><i class="av">' + esc(initials(ME.name)) + '</i><div><b>' + esc(short(ME.name, 10)) + '</b><span class="pts">' + s.me + '</span></div></div>' +
    '<div class="qn"><small>вопрос</small><b>' + (V.i + 1) + '<em>/' + V.n + '</em></b></div>' +
    '<div class="pl op"><div><b>' + esc(short(OPP.name, 10)) + '</b><span class="pts">' + s.opp + '</span></div><i class="av op">' + esc(initials(OPP.name)) + '</i></div>' +
  '</div>';
}
function renderGame(){
  var q = V.q, r = V.rev, picked = V.picked;
  var lockedCls = (V.locked || r) ? ' locked' : '';
  function cls(k){
    if (r) return k === r.ci ? ' correct' : (k === picked ? ' wrong' : ' dim');

  }
  function pk(k){
    if (!r) return '';

    return t ? '<span class="pks">' + t + '</span>' : '';
  }
  function list(){
    return '<div class="opts' + lockedCls + '">' + q.opts.map(function(o, k){
      return '<button class="opt' + cls(k) + '" data-k="' + k + '"><span class="k">' + LETTERS[k] + '</span><span class="t">' + esc(o) + '</span>' + pk(k) + '</button>';
    }).join('') + '</div>';
  }
  var body = '';
  if (q.kind === 'who'){
    body = '<div class="qbox">' + esc(q.text) + '</div><span class="qsub">Чьё это полномочие?</span>' + list();
  } else if (q.kind === 'what'){
    body = '<div class="organ"><div class="ic">' + I.gov + '</div><div><b>' + esc(q.organ) + '</b><span>Какое из этих полномочий принадлежит этому органу?</span></div></div>' + list();
  } else if (q.kind === 'jur2'){
    body = '<div class="qbox pink">' + esc(q.text) + '</div><span class="qsub">К чьему ведению это относится?</span>' +
      '<div class="two' + lockedCls + '">' + q.opts.map(function(o, k){
        return '<button class="opt' + cls(k) + '" data-k="' + k + '">' + (k === 0 ? I.fed : I.joint) + '<span>' + esc(o) + '</span>' + pk(k) + '</button>';
      }).join('') + '</div>';
  } else {
    body = '<div class="q">' + esc(q.text) + '</div>' + list();
  }
  var fb = '';
  if (r){
    var me = r.pts[my()], oo = r.pts[op()], got = r.pick[my()] === r.ci, none = r.pick[my()] < 0;
    var last = V.i + 1 >= V.n;
    fb = '<div class="fb ' + (got ? 'ok' : 'no') + '"><h4>' + (got ? 'Верно! +' + me : (none ? 'Время вышло' : 'Мимо!')) + '</h4>' +
      '<div class="oppline">' + esc(OPP.name) + ': ' + (oo ? '+' + oo + ' — ответ верный' : (r.pick[op()] < 0 ? 'не успел(а) ответить' : 'ошибся(ась)')) + '</div>' +
      '<p>' + r.note + '</p>' + (r.hint ? '<div class="hint">💡 ' + esc(r.hint) + '</div>' : '') + (r.src ? '<div class="src">' + esc(r.src) + '</div>' : '') +
      (V.ready ? '<div class="btn wait" style="margin-top:12px">Ждём соперника…</div>' : '<button class="btn" id="nx">' + (last ? 'К результатам' : 'Дальше') + I.go + '</button>') + '</div>';
  }
  var status = (!r && V.locked) ? '<div class="wtxt" id="wt">Ответ принят · ' + (V.oppDone ? 'соперник тоже ответил…' : 'ждём соперника…') + '</div>' : '';
  screen(
    '<div class="hud"><button class="iconbtn" id="ex" aria-label="Выйти">' + I.close + '</button><div class="mid">' + scoreboard() + '</div></div>' +
    (r ? '' : '<div class="tbar"><div id="tb" style="width:' + Math.max(0, 100 - (Date.now() - V.t0) / (T_SEC * 10)) + '%"></div><span id="tn">' + T_SEC + '</span></div>') +
    '<div class="card qcard">' +
      '<div class="qtag"><span class="chip' + (q.cat === 'Полномочия' ? '' : ' pink') + '">' + esc(q.cat) + '</span>' +
      (r ? '' : '<span class="ost' + (V.oppDone ? ' done' : '') + '" id="ost">' + (V.oppDone ? 'соперник ответил' : 'соперник думает…') + '</span>') + '</div>' +
      body + status +
    '</div>' + fb, 'game');
  $$('.opt').forEach(function(b){ b.onclick = function(){ pickAnswer(+b.getAttribute('data-k')); }; });
  $('#ex').onclick = function(){ confirmBox('Выйти из игры?', 'Битва прервётся у обоих игроков.', 'Выйти', leaveGame); };
  var nx = $('#nx');
  if (nx) nx.onclick = function(){
    V.ready = true;
    if (NET.role === 'host'){ H.ready.h = true; if (H.ready.g) advance(); else renderGame(); }
    else { send({t:'ready', i:V.i}); renderGame(); }
  };
  if (!r) window.__tint = setInterval(tick, 100);
  if (r){ var f = $('.fb'); if (f && f.scrollIntoView) setTimeout(function(){ try { f.scrollIntoView({behavior:'smooth', block:'nearest'}); } catch (e) {} }, 60); }
}
function applyReveal(m){
  clearInterval(window.__tint);
  V.rev = m; V.ready = false; V.locked = true;
  V.scores = {me:m.scores[my()], opp:m.scores[op()]};
  renderGame();
  if (m.pick[my()] === m.ci) confetti(14);
}

/* ---------- финал ---------- */
function showFinal(m){
  clearInterval(window.__tint);
  V = V || {n:N_Q};
  V.final = true; V.end = m; V.oppAgain = V.oppAgain || false; V.again = false;
  if (H) H.again = {h:false, g:false};
  renderFinal();
  var a = m.scores[my()], b = m.scores[op()];
  if (a >= b) confetti(a > b ? 46 : 22);
}
function renderFinal(){
  var m = V.end, mm = my(), oo = op();
  var a = m.scores[mm], b = m.scores[oo], win = a > b, draw = a === b;
  var rows = m.rows;
  var okMe = rows.filter(function(r){ return r.pk[mm] === r.ci; }).length, okOp = rows.filter(function(r){ return r.pk[oo] === r.ci; }).length;
  function dots(who){ return '<div class="dotrow">' + rows.map(function(r){ return '<i class="' + (r.pk[who] === r.ci ? 'y' : 'n') + '"></i>'; }).join('') + '</div>'; }
  var miss = rows.filter(function(r){ return r.pk[mm] !== r.ci; });
  var title = win ? 'Победа!' : (draw ? 'Ничья!' : 'В этот раз не вышло');
  var sub = win ? 'Полномочия ты знаешь отлично — ' + esc(OPP.name) + ' позади.' : (draw ? 'Силы равны — самое время для реванша.' : esc(OPP.name) + ' сегодня был(а) сильнее. Разбери ошибки — и в реванш!');
  screen(
    '<div class="result">' +
      (win || draw ? '<img class="logo" src="' + LOGO + '" alt="">' : sadCat()) +
      '<h2 class="hd">' + title + '</h2><p class="sub">' + sub + '</p>' +
      '<div class="duelbox">' +
        '<div class="side' + (win ? ' w' : '') + '"><small>' + esc(short(ME.name, 12)) + '</small><b>' + a + '</b><span>' + okMe + ' из ' + rows.length + ' верно</span>' + dots(mm) + '</div>' +
        '<div class="sep">:</div>' +
        '<div class="side op' + (!win && !draw ? ' w' : '') + '"><small>' + esc(short(OPP.name, 12)) + '</small><b>' + b + '</b><span>' + okOp + ' из ' + rows.length + ' верно</span>' + dots(oo) + '</div>' +
      '</div>' +
      (V.oppAgain ? '<div class="note-ok">' + esc(OPP.name) + ' хочет реванш!</div>' : '') +
      '<div class="stack"><button class="btn" id="again"' + (V.again ? ' disabled' : '') + '>' + (V.again ? 'Ждём согласия соперника…' : 'Реванш') + '</button><button class="btn ghost" id="hm">В начало</button></div>' +
    '</div>' +
    (miss.length
      ? '<div class="card miss"><h3 class="hd">Разбор ошибок</h3>' + miss.map(function(r){
          return '<div class="mi"><b>' + esc(r.label) + '</b><div class="ca">Верно: ' + esc(r.ans) + '</div>' + ((r.n || r.h) ? '<p>' + (r.n || '') + (r.h ? ' ' + esc(r.h) : '') + '</p>' : '') + (r.src ? '<small>' + esc(r.src) + '</small>' : '') + '</div>';
        }).join('') + '</div>'
      : '<div class="card miss"><h3 class="hd">Ни одной ошибки!</h3><p class="muted" style="margin:0">Все 10 ответов верные. Так держать!</p></div>'), 'final');
  $('#hm').onclick = leaveGame;
  $('#again').onclick = function(){
    if (V.again || !NET.role) return; V.again = true;
    if (NET.role === 'host'){ H.again.h = true; send({t:'again'}); if (H.again.g) return startGame(); }
    else send({t:'again'});
    renderFinal();
  };
}

/* ---------- старт ---------- */
window.addEventListener('DOMContentLoaded', function(){
  app = $('#app');
  if (typeof Peer === 'undefined'){ screen('<div class="center"><h2 class="h2 hd">Не загрузилась библиотека связи</h2><p class="muted">Обновите страницу.</p></div>'); return; }
  home();
  window.addEventListener('hashchange', function(){ if (!NET.role && !V) home(); });
  window.addEventListener('beforeunload', function(){ try { send({t:'bye'}); } catch (e) {} });
});
</script>
</body>
</html>
